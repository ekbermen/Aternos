          function pick(w){const f=$('f');f.value='';
            f.onchange=()=>{const r=new FileReader();r.onload=()=>{localStorage.setItem(w,r.result);skin()};if(f.files[0])r.readAsDataURL(f.files[0])};f.click()}
          async function show(p){if(!p)$('cl').style.display='none';$('login').style.display=p?'none':'block';$('panel').style.display=p?'block':'none';
            if(p){skin();$('qc').innerHTML=QC.map(c=>'<div class="chip" onclick="runCmd(\''+c+'\')">'+c+'</div>').join('');$('sy').innerHTML=SAY.map((c,i)=>'<div class="chip" onclick="runCmd(\'say '+c+'\')">'+c+'</div>').join('');$('seed').value=L('seed','');drawLM();drawCo();drawKinds();
              const c=(await py('cfg_get')).cfg||{};$('ka').checked=!!c.ka;$('sch').value=c.sched||'';$('na').checked=!!c.notifyAll;$('fr').value=(c.friends||[]).join(', ');
              loadServers();loadAccts();refresh();clearInterval(timer);timer=setInterval(()=>{if(!document.hidden)refresh()},30000)}}
          async function boot(){const r=await py('restore');show(r.ok);if(!r.ok&&r.error&&!/No such file|Errno 2/.test(r.error))$('le').textContent=r.error}
          async function doLogin(){$('le').textContent='Baglaniyor...';const r=await py('login',$('u').value,$('p').value);if(r.ok)show(true);else $('le').textContent=r.error}
          async function logout(){clearInterval(timer);Native.keepAlive(false);await py('logout');boot()}
          async function refresh(){const r=await py('state');
            if(!r.ok){T(r.error);$('info').textContent=r.error;return}ST=r;
            const s=r.status.toLowerCase();$('st').textContent=r.status;$('st').className='pill '+(s=='online'?'online':s=='offline'?'offline':'wait');
            $('nm').textContent=r.name;$('info').textContent=r.players+'/'+r.slots+' oyuncu - '+r.software+' '+r.version;
            $('onl').innerHTML=r.online.map(x=>'<div class="it"><span><span class="dot" style="background:#4ade80"></span>'+esc(x)+'</span></div>').join('')||'<small>Kimse yok</small>';
            $('inv').textContent=inv();try{Native.widget()}catch(e){}}
          function inv(){return '\u{1F3AE} '+(ST.name||'')+'\nAdres: '+(ST.host||'')+'\nPort: '+(ST.port||'')+'\nSurum: '+(ST.software||'')+' '+(ST.version||'')}
          function cp(){Native.copy(ST.name||'');T('Adres kopyalandi')}
          function openMc(){Native.mc('Aternos',ST.name||'')}
          async function act(w){T('...');const r=await py('act',w);T(r.ok?'Tamam':r.error);refresh()}
          function sync(){const fr=$('fr').value.split(',').map(x=>x.trim()).filter(Boolean);
            const c={ka:$('ka').checked,sched:$('sch').value,friends:fr,notifyAll:$('na').checked};
            py('cfg_set',JSON.stringify(c));Native.keepAlive(c.ka||!!c.sched||fr.length>0||c.notifyAll)}
          function drawKinds(){$('kc').innerHTML=Object.entries(KINDS).map(([k,v])=>'<div class="chip'+(k==kind?' on':'')+'" onclick="kind=\''+k+'\';drawKinds();loadList()">'+v+'</div>').join('')}
          async function loadList(){listAct('')}
          async function listAct(a,name){const nm=name!==undefined?name:(a?$('pn').value.trim():'');
            const r=await py('plist',kind,a,nm);if(!r.ok){$('lst').textContent=r.error;return}$('pn').value='';
            $('lst').innerHTML=r.items.map(x=>'<div class="it"><span>'+esc(x)+'</span><button class="r s" data-n="'+esc(x)+'" onclick="listAct(\'remove\',this.dataset.n)">Sil</button></div>').join('')||'<small>Bos</small>'}
          async function bulkAdd(){const ns=$('bulk').value.split(/[,\n]/).map(x=>x.trim()).filter(Boolean);
            for(const x of ns)await py('plist',kind,'add',x);$('bulk').value='';T(ns.length+' oyuncu eklendi');loadList()}
          async function loadHist(){const r=await py('hist');if(!r.ok)return;
            const pt=Object.entries(r.play).sort((a,b)=>b[1]-a[1]).map(([p,s])=>esc(p)+' '+Math.round(s/60)+' dk').join(' \u2022 ');
            $('hs').innerHTML=(pt?'<small>Toplam sure: '+pt+'</small>':'')+(r.items.map(e=>'<div class="it"><span>'+(e.e=='+'?'\u2795 ':'\u2796 ')+esc(e.p)+'</span><small>'+e.t+'</small></div>').join('')||'<small>Henuz kayit yok</small>')}
          async function setP(k,v){if(!k||v==='')return;const r=await py('prop',k,v);T(r.ok?k+' kaydedildi':r.error)}
          const PRE={survival:{gamemode:'survival',difficulty:'normal','allow-cheats':'false'},creative:{gamemode:'creative',difficulty:'peaceful','allow-cheats':'true'},minigame:{gamemode:'adventure',difficulty:'easy','allow-cheats':'true'}};
          async function preset(k){T('Uygulaniyor...');for(const [a,b] of Object.entries(PRE[k]))await py('prop',a,b);T('Profil uygulandi (yeniden baslat)')}
          function addCo(){const c=L('co',[]);if(!$('cn').value)return;c.push({n:$('cn').value,x:$('cx').value});S('co',c);$('cn').value=$('cx').value='';drawCo()}
          function drawCo(){$('co').innerHTML=L('co',[]).map((c,i)=>'<div class="it"><span><b>'+esc(c.n)+'</b> <small>'+esc(c.x)+'</small></span><button class="r s" onclick="delCo('+i+')">Sil</button></div>').join('')}
          function delCo(i){const c=L('co',[]);c.splice(i,1);S('co',c);drawCo()}
          async function loadServers(){const r=await py('servers');const s=$('sv');
            if(!r.ok||r.items.length<2){s.style.display='none';return}
            s.innerHTML=r.items.map((x,i)=>'<option value="'+i+'"'+(i==r.cur?' selected':'')+'>'+esc(x)+'</option>').join('');s.style.display='block'}
          async function pickSrv(i){await py('pick',i);$('st').textContent='...';refresh();loadHist();loadList()}
          async function loadAccts(){const r=await py('accounts');if(!r.ok)return;
            $('ac').innerHTML=r.list.map(x=>'<div class="it"><span>'+esc(x)+(x==r.active?' <small>(aktif)</small>':'')+'</span>'+(x==r.active?'':'<button class="s" data-n="'+esc(x)+'" onclick="switchAcct(this.dataset.n)">Gec</button>')+'</div>').join('')||'<small>Kayitli hesap yok</small>'}
          async function switchAcct(n){T('Hesap degisiyor...');const r=await py('switch',n);if(r.ok)show(true);else T(r.error)}
          function addAcct(){clearInterval(timer);$('u').value=$('p').value='';$('le').textContent='';$('cl').style.display='block';$('login').style.display='block';$('panel').style.display='none'}
          const QC=['list','time set day','time set night','weather clear'];
          const SAY=['Hos geldiniz!','Sunucu 5 dk sonra yeniden baslayacak','Etkinlik basliyor, spawn noktasina gelin!','Lutfen hile kullanmayin'];
          async function runCmd(c){c=c.trim();if(!c)return;$('cons').textContent='Gonderiliyor...';go(2);const r=await py('cmd',c);$('cons').textContent=r.ok?(r.lines.join('\n')||'Gonderildi (cikti yok)'):r.error}
          async function loadPacks(){$('pk2').innerHTML='<small>Yukleniyor...</small>';const r=await py('packs');if(!r.ok){$('pk2').textContent=r.error;return}
            $('pk2').innerHTML=r.items.map(x=>'<div class="it"><span>'+esc(x.n)+' <small>'+esc(x.d)+'</small></span><button class="r s" data-p="'+esc(x.p)+'" onclick="delPack(this)">Sil</button></div>').join('')||'<small>Paket yok</small>'}
          async function delPack(b){if(!b.dataset.s){b.dataset.s=1;b.textContent='Emin misin?';setTimeout(()=>{b.dataset.s='';b.textContent='Sil'},3000);return}
            const r=await py('delpack',b.dataset.p);T(r.ok?'Silindi':r.error);loadPacks()}
          const LM={off:'Kapali',pin:'PIN',bio:'Parmak izi',either:'Parmak izi veya PIN',both:'Parmak izi + PIN'};
          const lm=()=>L('lm',L('pin','')?'pin':'off');let pend=null,stage=0,hid=0;
          function drawLM(){$('lm').innerHTML=Object.entries(LM).map(([k,v])=>'<div class="chip'+(k==lm()?' on':'')+'" onclick="setLM(\''+k+'\')">'+v+'</div>').join('');
            $('lmh').textContent=Native.bioOk()?'':'Bu telefonda kayitli parmak izi yok veya desteklenmiyor.'}
          function setPin(){const v=$('pn2').value.trim();S('pin',v?btoa(v):'');$('pn2').value='';
            if(!v&&['pin','either','both'].includes(lm()))S('lm','off');T(v?'PIN ayarlandi':'PIN kaldirildi');drawLM()}
          function setLM(m){const v=$('pn2').value.trim();if(v)setPin();
            if(['pin','either','both'].includes(m)&&!L('pin','')){T('Once PIN yaz ve kaydet');return}
            if(m!='off'&&m!='pin'){if(!Native.bioOk()){T('Parmak izi kullanilamiyor');return}pend=m;Native.bio('Parmak iziyle dogrula');return}
            S('lm',m);T('Kilit: '+LM[m]);drawLM()}
          function lockInit(){let m=lm();if(m=='off')return;
            if(m!='pin'&&!Native.bioOk())m=L('pin','')?'pin':'off';if(m=='off')return;
            stage=0;$('lock').style.display='flex';lockUI(m)}
          function lockUI(m){const pinStep=m=='pin'||m=='either'||(m=='both'&&stage==1),bioStep=m!='pin'&&!(m=='both'&&stage==1);
            $('pi').style.display=$('lo').style.display=pinStep?'block':'none';$('lb').style.display=bioStep?'block':'none';
            $('lt').textContent=pinStep&&m=='both'?'PIN gir':'Panel kilitli';if(bioStep)Native.bio('Panel kilidi')}
          function onBio(ok){if(pend){const m=pend;pend=null;if(ok){S('lm',m);T('Kilit: '+LM[m]);drawLM()}else T('Dogrulanamadi');return}
            if($('lock').style.display!='flex'||!ok)return;
            if(lm()=='both'){stage=1;lockUI('both')}else openLock()}
          function openLock(){$('lock').style.display='none';$('pi').value=''}
          function unlock(){if(btoa($('pi').value)===L('pin','')){openLock()}else T('Yanlis PIN')}
          document.addEventListener('visibilitychange',()=>{if(document.hidden)hid=Date.now();else if(hid&&Date.now()-hid>60000&&!pend)lockInit()});
          lockInit();
          boot();
          </script></body></html>
          EOF

      - name: Chaquopy icin lxml surumunu sec
        shell: bash
        run: |
          IDX=$(curl -fsSL https://chaquo.com/pypi-13.1/lxml/ || true)
          vers() {
            echo "$IDX" \
              | grep -oE "lxml-[0-9]+(\.[0-9]+)*(-[0-9]+)?-cp311-cp311-android_[0-9]+_$1\.whl" \
              | sed -E 's/^lxml-([0-9]+(\.[0-9]+)*).*/\1/' | sort -Vu
          }
          echo "arm64_v8a   : $(vers arm64_v8a | tr '\n' ' ')"
          echo "armeabi_v7a : $(vers armeabi_v7a | tr '\n' ' ')"
          VER=$(vers arm64_v8a | grep -Fxf <(vers armeabi_v7a) | sort -V | tail -1 || true)
          if [ -z "$VER" ]; then
            echo "::warning::Indeks okunamadi, 4.9.2'ye dusuldu"
            VER=4.9.2
          fi
          for P in chaquopy-libcxx chaquopy-libiconv chaquopy-libxml2 chaquopy-libxslt; do
            if curl -fsSL "https://chaquo.com/pypi-13.1/$P/" | grep -q "cp311\|py3\|android"; then
              echo "var: $P"
            else
              echo "::warning::$P indekste bulunamadi"
            fi
          done
          echo "Secilen lxml: $VER"
          echo "LXML_VER=$VER" >> "$GITHUB_ENV"
          sed -i "s/LXML_VERSION/$VER/" P/app/build.gradle.kts
          grep -n lxml P/app/build.gradle.kts

      - name: lxml native kutuphane surumlerini wheel metadata'sindan oku
        shell: bash
        run: |
          # lxml wheel'i hangi libxml2/libxslt surumuyle derlendiyse tam o surumleri kurar.
          # Surum uyusmazligi (ABI) uygulamanin acilista cokmesine yol acar.
          python3 - "$LXML_VER" P/app/build.gradle.kts <<'PY'
          import io, os, re, sys, zipfile, urllib.request
          from urllib.parse import urljoin

          BASE = os.environ.get("CHAQ_INDEX", "https://chaquo.com/pypi-13.1")
          VER = sys.argv[1]
          GRADLE = sys.argv[2]
          FALLBACK = ["chaquopy-libcxx", "chaquopy-libiconv", "chaquopy-libxml2", "chaquopy-libxslt"]

          def get(u):
              return urllib.request.urlopen(u, timeout=60).read()

          def norm(n):
              return re.sub(r"[-_.]+", "_", n).lower()

          def vkey(v):
              return tuple(int(x) for x in re.findall(r"\d+", v))

          def find_wheel(pkg, ver=None, cp=None):
              url = "%s/%s/" % (BASE, pkg)
              html = get(url).decode()
              best = None
              for h in re.findall(r'href="([^"#]+\.whl)', html):
                  fn = os.path.basename(h)
                  if not fn.startswith(norm(pkg) + "-") and not fn.startswith(pkg + "-"):
                      continue
                  if not re.search(r"android_\d+_arm64_v8a", fn):
                      continue
                  if cp and cp not in fn:
                      continue
                  parts = fn.split("-")
                  v = parts[1]
                  if ver and v != ver:
                      continue
                  build = int(parts[2]) if parts[2].isdigit() else 0
                  key = (vkey(v), build)
                  if best is None or key > best[0]:
                      best = (key, v, urljoin(url, h))
              if best is None:
                  raise RuntimeError("wheel bulunamadi: %s %s" % (pkg, ver or ""))
              return best[1], best[2]

          def chaquopy_requires(whl):
              z = zipfile.ZipFile(io.BytesIO(whl))
              md = [n for n in z.namelist() if n.endswith(".dist-info/METADATA")][0]
              out = []
              for line in z.read(md).decode().splitlines():
                  if not line.startswith("Requires-Dist:"):
                      continue
                  req, _, marker = line.split(":", 1)[1].strip().partition(";")
                  if "extra" in marker:
                      continue
                  m = re.match(r"\s*([A-Za-z0-9_.-]+)\s*\(?\s*([<>=!~][^)]*)?\)?\s*$", req)
                  if m and m.group(1).lower().startswith("chaquopy-"):
                      out.append((m.group(1).lower(), (m.group(2) or "").replace(" ", "")))
              return out

          pins = {}
          def visit(pkg, spec=""):
              if pkg in pins:
                  return
              want = spec[2:] if spec.startswith("==") else None
              v, url = find_wheel(pkg, want)
              pins[pkg] = v
              for p, s in chaquopy_requires(get(url)):
                  visit(p, s)

          try:
              _, lurl = find_wheel("lxml", VER, "cp311")
              for p, s in chaquopy_requires(get(lurl)):
                  visit(p, s)
              if not pins:
                  raise RuntimeError("lxml wheel'i native bagimlilik bildirmiyor")
              lines = ['install("%s==%s")' % (p, v) for p, v in sorted(pins.items())]
              print("lxml wheel'inden okunan native pinler:", ", ".join("%s==%s" % kv for kv in sorted(pins.items())))
          except Exception as e:
              print("::warning::native pinler okunamadi (%r), pinsiz yedek liste kullaniliyor" % (e,))
              lines = ['install("%s")' % p for p in FALLBACK]

          t = open(GRADLE).read()
          pat = re.compile(r"^([ \t]*)// NATIVE_PLACEHOLDER\n", re.M)
          assert pat.search(t), "NATIVE_PLACEHOLDER bulunamadi"
          t = pat.sub(lambda m: "".join(m.group(1) + l + "\n" for l in lines), t)
          open(GRADLE, "w").write(t)
          PY
          grep -n 'install(' P/app/build.gradle.kts

      - name: Python bagimliliklarini otomatik coz
        shell: bash
        run: |
          # python-aternos'un TUM (dolayli dahil) bagimliliklarini runner'da pip ile cozer,
          # Chaquopy listesine otomatik ekler. Elle liste tutmaya gerek kalmaz.
          python -m venv /tmp/v
          /tmp/v/bin/pip install -q -U pip
          if /tmp/v/bin/pip install -q --dry-run --ignore-installed --report /tmp/r.json python-aternos; then
            echo "pip bagimlilik cozumu basarili"
          else
            echo "::warning::pip cozumu basarisiz, yedek liste kullaniliyor"
            echo '{"install":[]}' > /tmp/r.json
          fi
          python3 - <<'PY'
          import json, re
          FALLBACK = ["requests","urllib3","idna","certifi","charset-normalizer","pyparsing",
                      "requests-toolbelt","cloudscraper","websockets","typing-extensions",
                      "regex","js2py","tzlocal","six","pyjsparser"]
          rep = json.load(open("/tmp/r.json"))
          found = [i["metadata"]["name"] for i in rep.get("install", [])]
          norm = lambda n: re.sub(r"[-_.]+", "-", n).lower()
          skip = {"lxml", "python-aternos"}   # lxml ayri, python-aternos en sonda
          names = {}
          for n in FALLBACK + found:          # yedek liste her zaman dahil, tekrarlar elenir
              if norm(n) not in skip:
                  names.setdefault(norm(n), n)
          print("Chaquopy'ye eklenen paketler:", ", ".join(sorted(names)))
          f = "P/app/build.gradle.kts"
          t = open(f).read()
          pat = re.compile(r"^([ \t]*)// DEPS_PLACEHOLDER\n", re.M)
          assert pat.search(t), "DEPS_PLACEHOLDER bulunamadi"
          t = pat.sub(lambda m: "".join('%sinstall("%s")\n' % (m.group(1), n) for n in sorted(names.values())), t)
          open(f, "w").write(t)
          PY
          grep -n 'install(' P/app/build.gradle.kts

      - name: APK derle
        shell: bash
        run: |
          cd P
          gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log

      - name: Hata ozeti (sadece basarisiz olursa)
        if: failure()
        run: |
          echo "=========== HATA OZETI ==========="
          grep -nE "^e: |error:|What went wrong|Execution failed|Could not|FAILED|ERROR|No matching|pip" -A4 P/build.log | head -80

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: AternosPanel-apk
          path: P/app/build/outputs/apk/debug/*.apk
