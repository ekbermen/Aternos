name: Build Aternos Panel APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Android SDK hazirla (runner'da hazir gelir)
        run: |
          SDKM=$(ls $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | $SDKM --licenses > /dev/null || true
          $SDKM "platforms;android-34" "build-tools;34.0.0" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Proje dosyalarini uret
        run: |
          mkdir -p P/app/src/main/{python,assets,java/com/gooo/panel,res/drawable,res/layout,res/xml,res/mipmap-anydpi-v26}
          cd P

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AternosPanel"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
              id("com.chaquo.python") version "15.0.1" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g
          android.useAndroidX=true
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("com.chaquo.python")
          }
          android {
              namespace = "com.gooo.panel"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.gooo.panel"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
                  ndk { abiFilters += listOf("arm64-v8a", "armeabi-v7a") }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          chaquopy {
              defaultConfig {
                  version = "3.11"
                  buildPython("python3")
                  pip {
                      // lxml surumu workflow'da Chaquopy'nin gercekten sundugu wheel'lerden secilir
                      options("--no-deps")
                      // DEPS_PLACEHOLDER
                      // NATIVE_PLACEHOLDER
                      install("lxml==LXML_VERSION")
                      install("python-aternos")
                  }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
          <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
              <application android:label="Aternos Panel"
                  android:icon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service android:name=".KeepAlive" android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="server-keepalive"/>
                  </service>
              <receiver android:name=".PanelWidget" android:exported="false">
              <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
              <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
          </receiver>
          </application>
          </manifest>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_bg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#12151C" android:pathData="M0,0 H108 V108 H0 Z"/>
              <path android:fillColor="#00000000" android:strokeColor="#3B82F6" android:strokeWidth="2.5"
                  android:pathData="M21,54 a33,33 0 1,0 66,0 a33,33 0 1,0 -66,0 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/drawable/ic_launcher_fg.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#5FD068" android:pathData="M54,24 L80,39 L54,54 L28,39 Z"/>
              <path android:fillColor="#8A5A33" android:pathData="M28,39 L54,54 L54,84 L28,69 Z"/>
              <path android:fillColor="#6B4423" android:pathData="M80,39 L80,69 L54,84 L54,54 Z"/>
              <path android:fillColor="#4CB556" android:pathData="M28,39 L54,54 L54,61 L28,46 Z"/>
              <path android:fillColor="#3F9E49" android:pathData="M80,39 L80,46 L54,61 L54,54 Z"/>
          </vector>
          EOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_bg"/>
              <foreground android:drawable="@drawable/ic_launcher_fg"/>
          </adaptive-icon>
          EOF
          cat > app/src/main/res/drawable/widget_bg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android">
              <solid android:color="#151921"/>
              <corners android:radius="22dp"/>
          </shape>
          EOF
          cat > app/src/main/res/xml/widget_info.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:minWidth="250dp" android:minHeight="110dp"
              android:updatePeriodMillis="0"
              android:initialLayout="@layout/widget"
              android:resizeMode="horizontal|vertical"
              android:widgetCategory="home_screen"/>
          EOF
          cat > app/src/main/res/layout/widget.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:id="@+id/w_root"
              android:layout_width="match_parent" android:layout_height="match_parent"
              android:orientation="vertical" android:padding="12dp"
              android:background="@drawable/widget_bg">
              <TextView android:id="@+id/w_name" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:textColor="#EEF1F6" android:textSize="14sp" android:maxLines="1"/>
              <TextView android:id="@+id/w_st" android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:text="?" android:textColor="#FBBF24" android:textSize="20sp" android:textStyle="bold"/>
              <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content"
                  android:orientation="horizontal" android:layout_marginTop="6dp">
                  <Button android:id="@+id/w_start" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="Baslat"/>
                  <Button android:id="@+id/w_stop" android:layout_width="0dp" android:layout_height="wrap_content"
                      android:layout_weight="1" android:text="Durdur"/>
              </LinearLayout>
          </LinearLayout>
          EOF
          cat > app/src/main/java/com/gooo/panel/Widget.kt <<'EOF'
          package com.gooo.panel

          import android.app.PendingIntent
          import android.appwidget.AppWidgetManager
          import android.appwidget.AppWidgetProvider
          import android.content.ComponentName
          import android.content.Context
          import android.content.Intent
          import android.widget.RemoteViews
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform
          import java.io.File

          class PanelWidget : AppWidgetProvider() {
              override fun onUpdate(c: Context, m: AppWidgetManager, ids: IntArray) {
                  for (id in ids) m.updateAppWidget(id, views(c))
              }

              override fun onReceive(c: Context, i: Intent) {
                  super.onReceive(c, i)
                  val what = when (i.action) { ACT_START -> "start"; ACT_STOP -> "stop"; else -> return }
                  val pr = goAsync()
                  Thread {
                      try {
                          if (!Python.isStarted()) Python.start(AndroidPlatform(c))
                          val py = Python.getInstance().getModule("bridge")
                          py.callAttr("init", c.filesDir.absolutePath)
                          py.callAttr("act", what)
                          py.callAttr("state")
                      } catch (e: Exception) { }
                      refresh(c)
                      pr.finish()
                  }.start()
              }

              companion object {
                  const val ACT_START = "com.gooo.panel.START"
                  const val ACT_STOP = "com.gooo.panel.STOP"

                  private fun pi(c: Context, a: String, rc: Int) = PendingIntent.getBroadcast(
                      c, rc, Intent(c, PanelWidget::class.java).setAction(a),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )

                  fun views(c: Context): RemoteViews {
                      val l = try { File(c.filesDir, "last.txt").readLines() } catch (e: Exception) { emptyList() }
                      val st = l.getOrNull(0) ?: "?"
                      val v = RemoteViews(c.packageName, R.layout.widget)
                      v.setTextViewText(R.id.w_name, l.getOrNull(2) ?: "Aternos Panel")
                      v.setTextViewText(R.id.w_st, st.uppercase() + "  " + (l.getOrNull(1) ?: ""))
                      v.setTextColor(R.id.w_st, when (st) {
                          "online" -> 0xFF4ADE80.toInt(); "offline" -> 0xFFF87171.toInt(); else -> 0xFFFBBF24.toInt()
                      })
                      v.setOnClickPendingIntent(R.id.w_start, pi(c, ACT_START, 1))
                      v.setOnClickPendingIntent(R.id.w_stop, pi(c, ACT_STOP, 2))
                      v.setOnClickPendingIntent(R.id.w_root, PendingIntent.getActivity(
                          c, 3, Intent(c, MainActivity::class.java), PendingIntent.FLAG_IMMUTABLE))
                      return v
                  }

                  fun refresh(c: Context) {
                      val m = AppWidgetManager.getInstance(c)
                      for (id in m.getAppWidgetIds(ComponentName(c, PanelWidget::class.java)))
                          m.updateAppWidget(id, views(c))
                  }
              }
          }
          EOF

          cat > app/src/main/python/bridge.py <<'EOF'
          import json, os, time, datetime

          Client = None
          Lists = None
          _imp_err = None
          try:
              from python_aternos import Client, Lists
          except Exception as e:
              _imp_err = "python-aternos yuklenemedi: " + repr(e)


          import socket
          import urllib.request

          _orig_gai = socket.getaddrinfo
          _dns_cache = {}


          def _doh(host):
              # Telefonun DNS'i calismazsa IP'ye dogrudan baglanip Cloudflare/Google DoH ile cozer
              for u in ("https://1.1.1.1/dns-query?name=%s&type=A", "https://8.8.8.8/resolve?name=%s&type=A"):
                  try:
                      r = urllib.request.Request(u % host, headers={"accept": "application/dns-json"})
                      d = json.load(urllib.request.urlopen(r, timeout=6))
                      a = [x["data"] for x in d.get("Answer", []) if x.get("type") == 1]
                      if a:
                          return a
                  except Exception:
                      pass
              return []


          def _gai(host, *a, **k):
              try:
                  return _orig_gai(host, *a, **k)
              except socket.gaierror:
                  if not isinstance(host, str) or host.replace(".", "").isdigit():
                      raise
                  ips = _dns_cache.get(host) or _doh(host)
                  if not ips:
                      raise
                  _dns_cache[host] = ips
                  return _orig_gai(ips[0], *a, **k)


          socket.getaddrinfo = _gai


          def _chk():
              if _imp_err:
                  raise RuntimeError(_imp_err)

          _at = None
          _dir = ""


          def _isnet(e):
              m = str(e)
              return any(x in m for x in ("NameResolution", "Errno 7", "Max retries", "Failed to resolve", "timed out", "Connection"))


          def _nice(e):
              m = str(e)
              if _isnet(e):
                  return "Internet/DNS yok. Baglanti gelince otomatik tekrar denenecek."
              if "Cloudflare" in m or "403" in m:
                  return "Aternos erisimi gecici engelledi (Cloudflare). Biraz bekle."
              return m[:160]


          def _ok(**k):
              k["ok"] = True
              return json.dumps(k)


          def _err(e):
              return json.dumps({"ok": False, "error": _nice(e)})


          def _g(o, n, d=None):
              try:
                  return getattr(o, n)
              except Exception:
                  return d


          def _retry(f, n=3):
              for i in range(n):
                  try:
                      return f()
                  except Exception as e:
                      if i == n - 1 or not _isnet(e):
                          raise
                      time.sleep(2 * (i + 1))


          def _srvs():
              # python-aternos 1.x/2.x: client.list_servers(); 3.x: client.account.list_servers()
              f = getattr(_at, "list_servers", None)
              if f is None:
                  f = _at.account.list_servers
              return f()


          def _s():
              def go():
                  global _at
                  _chk()
                  if _at is None:
                      _at = Client.restore_session(_sess())
                  l = _srvs()
                  if not l:
                      raise RuntimeError("Bu hesapta sunucu bulunamadi")
                  i = _jl("srv.json", {}).get("i", 0)
                  return l[i if i < len(l) else 0]
              return _retry(go)


          def _acc():
              return _jl("acc.json", {"active": "", "list": []})


          def _sess():
              n = _acc().get("active")
              return _dir + "/session_" + n if n else _dir + "/session"


          def _reset():
              for f in ("online.json", "last.txt"):
                  try:
                      os.remove(_dir + "/" + f)
                  except Exception:
                      pass


          def _jl(n, d):
              try:
                  with open(_dir + "/" + n) as f:
                      return json.load(f)
              except Exception:
                  return d


          def _js(n, v):
              with open(_dir + "/" + n, "w") as f:
                  json.dump(v, f)


          def init(d):
              global _dir
              _dir = d
              return _ok()


          def restore():
              global _at
              try:
                  _chk()
                  _at = Client.restore_session(_sess())
                  _retry(lambda: _srvs())
                  return _ok()
              except Exception as e:
                  _at = None
                  return _err(e)


          def login(user, pw):
              global _at
              try:
                  _chk()
                  c = Client()
                  _retry(lambda: c.login(user, pw))
                  n = "".join(ch for ch in user if ch.isalnum() or ch in "-_.") or "hesap"
                  a = _acc()
                  if not a["list"] and os.path.exists(_dir + "/session"):
                      os.rename(_dir + "/session", _dir + "/session_eski-hesap")
                      a["list"].append("eski-hesap")
                  c.save_session(_dir + "/session_" + n)
                  if n not in a["list"]:
                      a["list"].append(n)
                  a["active"] = n
                  _js("acc.json", a)
                  _js("srv.json", {"i": 0})
                  _reset()
                  _at = c
                  return _ok()
              except Exception as e:
                  return _err(e)


          def logout():
              global _at
              a = _acc()
              n = a.get("active")
              try:
                  os.remove(_dir + ("/session_" + n if n else "/session"))
              except Exception:
                  pass
              if n:
                  a["list"] = [x for x in a["list"] if x != n]
                  a["active"] = a["list"][0] if a["list"] else ""
                  _js("acc.json", a)
              _at = None
              _js("srv.json", {"i": 0})
              _reset()
              return _ok()


          def accounts():
              a = _acc()
              return _ok(list=a.get("list", []), active=a.get("active", ""))


          def switch(n):
              global _at
              a = _acc()
              if n not in a["list"]:
                  return _err(RuntimeError("Hesap bulunamadi"))
              a["active"] = n
              _js("acc.json", a)
              _js("srv.json", {"i": 0})
              _reset()
              _at = None
              return restore()


          def servers():
              try:
                  _s()
                  l = _srvs()
                  return _ok(items=[str(_g(x, "address", "sunucu")) for x in l], cur=_jl("srv.json", {}).get("i", 0))
              except Exception as e:
                  return _err(e)


          def pick(i):
              _js("srv.json", {"i": int(i)})
              _reset()
              return _ok()


          def _last(s, st):
              try:
                  with open(_dir + "/last.txt", "w") as f:
                      f.write("\n".join([st, "%s/%s" % (_g(s, "players_count", 0), _g(s, "slots", 0)), str(_g(s, "address", ""))]))
              except Exception:
                  pass


          def _prev_status():
              try:
                  with open(_dir + "/last.txt") as f:
                      return f.readline().strip()
              except Exception:
                  return ""


          def _track(s):
              # giris/cikis gecmisi + arkadas bildirimi (state ve tick ortak kullanir)
              c = _jl("cfg.json", {})
              cur = [str(p) for p in (_g(s, "players_list", []) or [])]
              prev = _jl("online.json", [])
              ev = _jl("hist.json", [])
              now = datetime.datetime.now()
              t, ts, alert = now.strftime("%d.%m %H:%M"), int(time.time()), []
              fr = [x.lower() for x in c.get("friends", [])]
              for p in cur:
                  if p not in prev:
                      ev.append({"t": t, "ts": ts, "p": p, "e": "+"})
                      if c.get("notifyAll") or p.lower() in fr:
                          alert.append(p)
              for p in prev:
                  if p not in cur:
                      ev.append({"t": t, "ts": ts, "p": p, "e": "-"})
              _js("online.json", cur)
              _js("hist.json", ev[-300:])
              return cur, alert


          def state():
              try:
                  s = _s()
                  _retry(s.fetch)
                  cur, _a = _track(s)
                  _last(s, str(_g(s, "status", "?")).lower())
                  return _ok(
                      name=str(_g(s, "address", "")),
                      host=str(_g(s, "domain", "")),
                      port=str(_g(s, "port", "")),
                      status=str(_g(s, "status", "?")),
                      players=_g(s, "players_count", 0),
                      slots=_g(s, "slots", 0),
                      version=str(_g(s, "version", "")),
                      software=str(_g(s, "software", "")),
                      online=cur,
                  )
              except Exception as e:
                  return _err(e)


          def act(what):
              try:
                  s = _s()
                  getattr(s, what)()  # start / stop / restart / confirm
                  return _ok()
              except Exception as e:
                  return _err(e)


          def plist(kind, action, name):
              try:
                  l = _s().players(getattr(Lists, kind))  # whl / ops / ban
                  if action == "add" and name:
                      l.add(name)
                  elif action == "remove" and name:
                      l.remove(name)
                  return _ok(items=[str(p) for p in l.list_players(cache=False)])
              except Exception as e:
                  return _err(e)


          def prop(key, value):
              try:
                  _s().options.set_server_prop(key, value)
                  return _ok()
              except Exception as e:
                  return _err(e)


          def cfg_set(j):
              _js("cfg.json", json.loads(j))
              return _ok()


          def cfg_get():
              return _ok(cfg=_jl("cfg.json", {}))


          def hist():
              ev = _jl("hist.json", [])
              tot, st = {}, {}
              for e in ev:
                  if e["e"] == "+":
                      st[e["p"]] = e["ts"]
                  elif e["p"] in st:
                      tot[e["p"]] = tot.get(e["p"], 0) + e["ts"] - st.pop(e["p"])
              for p, t0 in st.items():
                  tot[p] = tot.get(p, 0) + int(time.time()) - t0
              return _ok(items=ev[-60:][::-1], play=tot)


          def _due(sch, c, now):
              try:
                  h, m = map(int, sch.split(":"))
              except Exception:
                  return False
              d = (now - now.replace(hour=h, minute=m, second=0, microsecond=0)).total_seconds()
              return 0 <= d < 300 and c.get("fired") != now.strftime("%Y-%m-%d")


          def tick():
              # 7/24 + zamanlama + arkadas bildirimi. Cikti: "durum|bildirim metni"
              try:
                  c = _jl("cfg.json", {})
                  now = datetime.datetime.now()
                  s = _s()
                  _retry(s.fetch)
                  st = str(s.status).lower()
                  try:
                      if "confirm" in st:
                          s.confirm()
                      elif st == "offline":
                          if c.get("ka"):
                              s.start()
                          elif c.get("sched") and _due(c["sched"], c, now):
                              c["fired"] = now.strftime("%Y-%m-%d")
                              _js("cfg.json", c)
                              s.start()
                  except Exception as e:
                      st = st + " (" + _nice(e)[:40] + ")"
                  _cur, alert = _track(s)
                  msgs = [p + " girdi" for p in alert]
                  pv = _prev_status()
                  if pv and pv != st.split(" ")[0] and st.split(" ")[0] in ("online", "offline"):
                      msgs.append("Sunucu " + st.split(" ")[0])
                  _last(s, st.split(" ")[0])
                  return st + "|" + ", ".join(msgs)
              except Exception as e:
                  return "hata: " + _nice(e) + "|"


          def _run(cmd, secs):
              # websocket konsolu: komut gonderir, birkac saniye log toplar (sunucu online olmali)
              import asyncio
              from python_aternos.atwss import Streams
              lines = []

              async def go():
                  w = _s().wss()

                  @w.wssreceiver(Streams.console)
                  async def _l(msg):
                      lines.append(str(msg).replace("\r", "")[:300])

                  t = asyncio.create_task(w.connect())
                  for _ in range(60):
                      if getattr(w, "socket", None) is not None:
                          break
                      await asyncio.sleep(0.1)
                  await asyncio.sleep(0.7)
                  if cmd:
                      await w.command(cmd)
                  await asyncio.sleep(secs)
                  try:
                      await w.close()
                  except Exception:
                      pass
                  t.cancel()

              asyncio.run(go())
              return lines


          def cmd(c):
              try:
                  _chk()
                  return _ok(lines=_run(c, 3)[-40:])
              except Exception as e:
                  return _err(e)


          def packs():
              # kurulu addon paketlerini listeler (Bedrock: behavior_packs / resource_packs)
              try:
                  fm = _s().files()
                  out = []
                  for d in ("/behavior_packs", "/resource_packs"):
                      try:
                          out += [{"d": d[1:], "n": f.name, "p": f.path} for f in fm.list_dir(d)]
                      except Exception:
                          pass
                  return _ok(items=out)
              except Exception as e:
                  return _err(e)


          def delpack(path):
              try:
                  _s().files().get_file(path).delete()
                  return _ok()
              except Exception as e:
                  return _err(e)
          EOF

          cat > app/src/main/java/com/gooo/panel/MainActivity.kt <<'EOF'
          package com.gooo.panel

          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.graphics.Color
          import android.util.Log
          import android.widget.ScrollView
          import android.widget.TextView
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var chooser: ValueCallback<Array<Uri>>? = null

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  try { setup() } catch (t: Throwable) { showError(t) }
              }

              private fun showError(t: Throwable) {
                  val tv = TextView(this)
                  tv.text = "Baslatma hatasi (ekran goruntusu al):\n\n" + Log.getStackTraceString(t)
                  tv.setTextColor(Color.WHITE)
                  tv.setTextIsSelectable(true)
                  tv.setPadding(32, 96, 32, 32)
                  val sv = ScrollView(this)
                  sv.setBackgroundColor(Color.parseColor("#0f1115"))
                  sv.addView(tv)
                  setContentView(sv)
              }

              private fun setup() {
                  if (!Python.isStarted()) Python.start(AndroidPlatform(this))
                  Python.getInstance().getModule("bridge").callAttr("init", filesDir.absolutePath)
                  if (Build.VERSION.SDK_INT >= 33)
                      requestPermissions(arrayOf("android.permission.POST_NOTIFICATIONS"), 1)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.addJavascriptInterface(Bridge(), "Native")
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams
                      ): Boolean {
                          chooser?.onReceiveValue(null)
                          chooser = cb
                          startActivityForResult(p.createIntent(), 7)
                          return true
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              override fun onActivityResult(r: Int, c: Int, d: Intent?) {
                  if (r == 7) {
                      chooser?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(c, d))
                      chooser = null
                  }
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun call(id: String, fn: String, args: String) {
                      Thread {
                          val out = try {
                              val a = JSONArray(args)
                              val l = Array<Any>(a.length()) { a.getString(it) }
                              Python.getInstance().getModule("bridge").callAttr(fn, *l).toString()
                          } catch (e: Exception) {
                              """{"ok":false,"error":${JSONObject.quote(e.message ?: "hata")}}"""
                          }
                          runOnUiThread {
                              web.evaluateJavascript(
                                  "window.onPy(${JSONObject.quote(id)},${JSONObject.quote(out)})", null
                              )
                          }
                      }.start()
                  }

                  private fun js(s: String) = runOnUiThread { web.evaluateJavascript(s, null) }

                  @android.annotation.SuppressLint("NewApi")
                  @Suppress("DEPRECATION")
                  @JavascriptInterface
                  fun bioOk(): Boolean {
                      if (Build.VERSION.SDK_INT < 29) return false
                      val m = getSystemService(android.hardware.biometrics.BiometricManager::class.java) ?: return false
                      val r = if (Build.VERSION.SDK_INT >= 30)
                          m.canAuthenticate(android.hardware.biometrics.BiometricManager.Authenticators.BIOMETRIC_STRONG)
                      else m.canAuthenticate()
                      return r == android.hardware.biometrics.BiometricManager.BIOMETRIC_SUCCESS
                  }

                  @android.annotation.SuppressLint("NewApi")
                  @JavascriptInterface
                  fun bio(title: String) = runOnUiThread {
                      if (Build.VERSION.SDK_INT < 29) { js("onBio(false)"); return@runOnUiThread }
                      try {
                          val ex = mainExecutor
                          val p = android.hardware.biometrics.BiometricPrompt.Builder(this@MainActivity)
                              .setTitle(title)
                              .setNegativeButton("Iptal", ex) { _, _ -> js("onBio(false)") }
                              .build()
                          p.authenticate(android.os.CancellationSignal(), ex,
                              object : android.hardware.biometrics.BiometricPrompt.AuthenticationCallback() {
                                  override fun onAuthenticationSucceeded(r: android.hardware.biometrics.BiometricPrompt.AuthenticationResult?) {
                                      js("onBio(true)")
                                  }
                                  override fun onAuthenticationError(c: Int, s: CharSequence?) { js("onBio(false)") }
                              })
                      } catch (e: Exception) { js("onBio(false)") }
                  }

                  @JavascriptInterface
                  fun url(u: String) = runOnUiThread {
                      try { startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(u))) } catch (e: Exception) { }
                  }

                  @JavascriptInterface
                  fun widget() { PanelWidget.refresh(this@MainActivity) }

                  @JavascriptInterface
                  fun copy(t: String) = runOnUiThread {
                      (getSystemService(CLIPBOARD_SERVICE) as android.content.ClipboardManager)
                          .setPrimaryClip(android.content.ClipData.newPlainText("a", t))
                  }

                  @JavascriptInterface
                  fun share(t: String) = runOnUiThread {
                      val i = Intent(Intent.ACTION_SEND).setType("text/plain").putExtra(Intent.EXTRA_TEXT, t)
                      startActivity(Intent.createChooser(i, null))
                  }

                  @JavascriptInterface
                  fun mc(name: String, hostPort: String) = runOnUiThread {
                      try {
                          startActivity(Intent(Intent.ACTION_VIEW,
                              Uri.parse("minecraft://?addExternalServer=" + Uri.encode(name) + "|" + hostPort)))
                      } catch (e: Exception) { }
                  }

                  @JavascriptInterface
                  fun battery() = runOnUiThread {
                      try {
                          startActivity(Intent(android.provider.Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS,
                              Uri.parse("package:$packageName")))
                      } catch (e: Exception) { }
                  }

                  @JavascriptInterface
                  fun keepAlive(on: Boolean) {
                      val i = Intent(this@MainActivity, KeepAlive::class.java)
                      if (on) startForegroundService(i) else stopService(i)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/gooo/panel/KeepAlive.kt <<'EOF'
          package com.gooo.panel

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.os.Build
          import android.os.IBinder
          import android.os.PowerManager
          import com.chaquo.python.Python
          import com.chaquo.python.android.AndroidPlatform

          class KeepAlive : Service() {
              @Volatile private var run = false
              private var wl: PowerManager.WakeLock? = null

              override fun onBind(i: Intent?): IBinder? = null

              private fun note(t: String): Notification =
                  Notification.Builder(this, "ka")
                      .setContentTitle("Panel arka planda calisiyor")
                      .setContentText(t)
                      .setSmallIcon(android.R.drawable.ic_popup_sync)
                      .setOngoing(true)
                      .build()

              private fun alert(t: String): Notification =
                  Notification.Builder(this, "al")
                      .setContentTitle("Panel bildirimi")
                      .setContentText(t)
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .setAutoCancel(true)
                      .build()

              override fun onStartCommand(i: Intent?, f: Int, s: Int): Int {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("ka", "Arka plan", NotificationManager.IMPORTANCE_LOW))
                  nm.createNotificationChannel(NotificationChannel("al", "Oyuncu bildirimi", NotificationManager.IMPORTANCE_DEFAULT))
                  if (Build.VERSION.SDK_INT >= 34)
                      startForeground(1, note("basliyor"), ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  else startForeground(1, note("basliyor"))
                  if (wl == null) {
                      wl = getSystemService(PowerManager::class.java)
                          .newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "panel:ka")
                      wl?.acquire()
                  }
                  if (!Python.isStarted()) Python.start(AndroidPlatform(this))
                  val py = Python.getInstance().getModule("bridge")
                  py.callAttr("init", filesDir.absolutePath)
                  if (!run) {
                      run = true
                      Thread {
                          var fail = 0
                          while (run) {
                              val out = try { py.callAttr("tick").toString() } catch (e: Exception) { "hata: " + e.message + "|" }
                              val p = out.split("|", limit = 2)
                              if (p[0].startsWith("hata")) fail++ else fail = 0
                              nm.notify(1, note(p[0]))
                              PanelWidget.refresh(this@KeepAlive)
                              if (p.size > 1 && p[1].isNotBlank()) nm.notify(2, alert(p[1]))
                              // Aternos sik istegi bot sayip hesabi askiya alabilir: normal 60 sn, hatada 120/240/480 sn (internet gelince normale doner)
                              try { Thread.sleep(minOf(60000L shl minOf(fail, 3), 480000L)) } catch (e: InterruptedException) { }
                          }
                      }.start()
                  }
                  return START_STICKY
              }

              override fun onDestroy() {
                  run = false
                  wl?.release()
                  wl = null
              }
          }
          EOF

